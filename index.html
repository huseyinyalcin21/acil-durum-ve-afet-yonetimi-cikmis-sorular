<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acil Durum ve Afet Yönetimi Çıkmış Sorular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#22303D;
    --navy:#16232F;
    --navy-deep:#0F1A23;
    --paper:#F2EBD8;
    --paper-dim:#E9E0C8;
    --rule-red:#B33A3A;
    --rule-blue:#4A6C8C;
    --green:#3F6B4F;
    --green-dim:#335a41;
    --mustard:#D1A33B;
    --paper-shadow: 0 18px 40px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 20% -10%, #1c2e3d 0%, transparent 60%),
      var(--navy);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  ::selection{background:var(--mustard); color:var(--navy-deep);}

  header{
    padding:26px clamp(16px,4vw,48px) 16px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    border-bottom:1px solid rgba(242,235,216,0.12);
    flex-wrap:wrap;
  }
  header h1{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:clamp(22px,3vw,28px);
    margin:0;
  }
  header h1 span{color:var(--mustard);}
  header p{margin:4px 0 0; font-size:12px; color:rgba(242,235,216,0.5);}

  .layout{
    flex:1;
    display:grid;
    grid-template-columns:230px 1fr;
    min-height:0;
  }
  @media (max-width:760px){ .layout{grid-template-columns:1fr;} }

  .drawer{
    border-right:1px solid rgba(242,235,216,0.12);
    padding:20px 14px 24px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .drawer-label{font-size:11px; color:rgba(242,235,216,0.45); padding:0 8px 8px;}
  .deck-btn{
    text-align:left; background:none; border:1px solid transparent;
    color:var(--paper); padding:10px; border-radius:3px;
    font-family:inherit; font-size:13.5px; cursor:pointer;
    display:flex; justify-content:space-between; gap:8px;
  }
  .deck-btn:hover{background:rgba(242,235,216,0.06);}
  .deck-btn.active{background:rgba(209,163,59,0.12); border-color:rgba(209,163,59,0.4); color:var(--mustard);}
  .deck-btn small{opacity:0.6; font-weight:400;}
  .new-deck{
    margin-top:12px; padding:10px; border:1px dashed rgba(242,235,216,0.3);
    border-radius:3px; background:none; color:rgba(242,235,216,0.7);
    font-family:inherit; font-size:13px; cursor:pointer;
  }
  .new-deck:hover{border-color:var(--mustard); color:var(--mustard);}
  .edit-link{
    margin-top:auto; padding-top:14px; border-top:1px solid rgba(242,235,216,0.1);
    font-size:12px; color:rgba(242,235,216,0.45); background:none; border-left:none; border-right:none; border-bottom:none;
    text-align:left; cursor:pointer; font-family:inherit;
  }
  .edit-link:hover{color:var(--mustard);}

  main{
    padding:clamp(20px,4vw,44px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
  }
  .deck-heading{
    width:100%; max-width:640px;
    display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;
  }
  .deck-heading h2{font-family:'Lora', serif; font-size:21px; font-weight:600; margin:0;}
  .deck-heading .count{font-size:12px; color:rgba(242,235,216,0.5);}

  .progress-wrap{width:100%; max-width:640px;}
  .progress-track{
    width:100%; height:6px; border-radius:3px;
    background:rgba(242,235,216,0.12); overflow:hidden;
  }
  .progress-fill{height:100%; background:var(--mustard); transition:width 0.35s ease;}
  .progress-label{
    display:flex; justify-content:space-between; font-size:11.5px;
    color:rgba(242,235,216,0.55); margin-top:6px;
  }

  .quiz-box{
    width:100%; max-width:640px; background:var(--paper); color:var(--ink);
    border-radius:6px; box-shadow:var(--paper-shadow); padding:36px 40px; position:relative;
  }
  .quiz-box::before{
    content:""; position:absolute; top:38px; left:0; right:0; height:2px;
    background:var(--rule-red); opacity:0.5;
  }
  .quiz-eyebrow{font-size:11px; color:rgba(34,48,61,0.45);}
  .quiz-q{
    font-family:'Lora', serif; font-size:clamp(16px,2.1vw,20px); font-weight:600;
    margin:18px 0 22px; line-height:1.5;
  }
  .quiz-options{display:grid; gap:10px;}
  .quiz-option{
    text-align:left; font-family:inherit; font-size:14px; padding:13px 16px;
    border-radius:4px; border:1px solid rgba(34,48,61,0.2);
    background:rgba(34,48,61,0.03); cursor:pointer; color:var(--ink);
    display:flex; gap:10px;
  }
  .quiz-option .opt-letter{font-weight:600; color:rgba(34,48,61,0.5); min-width:16px;}
  .quiz-option:hover{border-color:var(--rule-blue);}
  .quiz-option.correct{background:rgba(63,107,79,0.15); border-color:var(--green);}
  .quiz-option.wrong{background:rgba(179,58,58,0.13); border-color:var(--rule-red);}
  .quiz-option:disabled{cursor:default;}
  .quiz-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px; font-size:12.5px; color:rgba(34,48,61,0.55);
  }
  .quiz-next{
    font-family:inherit; font-size:12.5px; padding:9px 18px; border-radius:4px;
    border:none; background:var(--green); color:#fff; cursor:pointer;
  }
  .quiz-next:disabled{opacity:0.35; cursor:default;}

  .quiz-result{text-align:center; padding:16px 0;}
  .quiz-result .badge{font-size:12px; color:rgba(34,48,61,0.55);}
  .quiz-result .score{
    font-family:'Lora', serif; font-size:38px; font-weight:600; color:var(--green-dim); margin:6px 0;
  }
  .quiz-result .sub{font-size:13px; color:rgba(34,48,61,0.6); margin-bottom:20px;}
  .restart-btn{
    font-family:inherit; font-size:13px; padding:10px 20px; border-radius:4px;
    border:none; background:var(--mustard); color:var(--navy-deep); cursor:pointer; font-weight:600;
  }

  .empty-state{text-align:center; color:rgba(242,235,216,0.5); font-size:13px; padding:40px 0; max-width:640px;}

  /* Editor overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(15,26,35,0.72);
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow:auto; z-index:10;
  }
  .editor-panel{
    width:100%; max-width:680px; background:var(--navy-deep);
    border:1px solid rgba(242,235,216,0.15); border-radius:8px; padding:26px 28px;
  }
  .editor-panel-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .editor-panel-header h3{font-family:'Lora', serif; font-size:18px; margin:0;}
  .close-btn{background:none; border:none; color:rgba(242,235,216,0.6); font-size:18px; cursor:pointer;}
  .close-btn:hover{color:var(--mustard);}
  .card-list{display:flex; flex-direction:column; gap:14px; max-height:65vh; overflow:auto;}
  .empty-cards{font-size:12px; color:rgba(242,235,216,0.4); padding:10px 0;}
  .q-card{
    background:rgba(242,235,216,0.04); border:1px solid rgba(242,235,216,0.1);
    border-radius:6px; padding:14px 16px;
  }
  .q-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .q-card textarea.q-text{
    font-family:inherit; font-size:13px; background:none; color:rgba(242,235,216,0.92);
    border:1px solid rgba(242,235,216,0.15); border-radius:4px; padding:8px 10px; width:100%;
    resize:vertical; min-height:44px;
  }
  .q-card textarea.q-text:focus{outline:none; border-color:var(--mustard);}
  .del-q{background:none; border:none; color:rgba(242,235,216,0.35); cursor:pointer; font-size:14px; flex-shrink:0;}
  .del-q:hover{color:var(--rule-red);}
  .opt-row{display:flex; align-items:center; gap:8px; margin-top:6px;}
  .opt-row input[type=radio]{accent-color:var(--green); flex-shrink:0;}
  .opt-row input[type=text]{
    flex:1; font-family:inherit; font-size:12.5px; background:none; color:rgba(242,235,216,0.85);
    border:1px solid rgba(242,235,216,0.12); border-radius:4px; padding:6px 8px;
  }
  .opt-row input[type=text]:focus{outline:none; border-color:var(--mustard);}
  .opt-row.is-correct input[type=text]{border-color:rgba(63,107,79,0.6); color:#a9d3b7;}
</style>
</head>
<body>

<header>
  <div>
    <h1>Acil Durum ve Afet Yönetimi <span>Çıkmış Sorular</span></h1>
    <p>made by @huseyin.yalcin</p>
  </div>
</header>

<div class="layout">
  <nav class="drawer">
    <div class="drawer-label">DERSLER</div>
    <div id="deckList"></div>
    <button class="new-deck" id="newDeckBtn">Yeni ders ekle.</button>
    <button class="edit-link" id="editLink">Soruları düzenle.</button>
  </nav>
  <main id="mainArea"></main>
</div>

<div id="overlayRoot"></div>

<script>
(function(){
  // ---------- State (in-memory only) ----------
  // Her kart: {id, question, options:[5 metin], correctIndex}
  let decks = [
    {
      id: 'ADY203',
      name: 'ADY203-KBRN Savunma ve Güvenlik-Ara Sınavlar',
      cards: 
	[
{id:1, question:"Aşağıdakilerden hangisi kargaşa bastırma ajanları arasında yer almaz?", options:["Difenilkloroarsin","O-Klorobenzalmalononitril","Dibenzoksazepin","3-Kuinuklidinil Benzilat","Adamzit"], correctIndex:3},
{id:2, question:"Aşağıdakilerden hangisi sinir ajanlarına maruz kalan bir hastanın temizlenmesinde kullanılacak kimyasallardan biridir?", options:["Sodyum hidroksit","Kalsiyum hipoklorit çözeltisi","Çamaşır suyu","Kostik soda çözeltisi","Alkol"], correctIndex:3},
{id:3, question:"Aşağıdakilerden hangisi sinir ajanlarının vücutta yarattığı etkilerden biri değildir?", options:["Göz bebeklerinde büyüme","Aşırı terleme","Öksürük","Kusma","Duygusal değişkenlik"], correctIndex:0},
{id:4, question:"Toksik etkileri sonucunda canlıları; öldürme, yaralama veya temel yaşam fonksiyonlarını bozarak etkisiz hale getirme gibi özelliklere sahip kimyasal maddelere genel olarak ------- denilmektedir. Yukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", options:["kimyasal molekül","kimyasal silah","kimyasal savaş ajanı","kitle imha silahı","kimyasal savaş silahı"], correctIndex:2},
{id:5, question:"Aşağıdakilerden hangisi yüksek dereceli zehirli kimyasal maddeler arasında yer almaz?", options:["Paration","Amonyak","Hidrojen klorür","Sülfirik asit","Klor"], correctIndex:0},
{id:6, question:"Aşağıdakilerden hangisi B grubu biyolojik savaş ajanlarının ortak özelliklerinden biridir?", options:["Düşük ölüm oranları ile sonuçlanması","Çok kolay yayılabilmesi","Kişiden kişiye kolayca bulaşabilmesi","Halk sağlığı için özel hazırlıklar gerektirmesi","Ülke güvenliği açısından yüksek risk oluşturması"], correctIndex:0},
{id:7, question:"Kimyasal ve biyolojik silahların kullanımı ilk kez aşağıdakilerden hangisi ile yasaklanmıştır?", options:["Brundtland Raporu","İstanbul Sözleşmesi","Paris Antlaşması","Londra Protokolü","Cenevre Protokolü"], correctIndex:4},
{id:8, question:"Aşağıdakilerden hangisi biyolojik saldırı öncesi yapılması gerekenlerden biridir?", options:["Elbiseler iliklenmeli, vücudun açık olan yerleri kapatılmalıdır.","Açıktaki yaralar mutlaka kapatılmalıdır.","Kemirgenler ve eklembacaklılar ile mücadele edilmelidir.","Kapalı kaplardaki kirlenmemiş gıdalar ve sular tüketilmelidir.","Cilt temizliği %0,5'lik sodyum hipoklorit çözeltisi ile yapılmalıdır."], correctIndex:2},
{id:9, question:"Hastalık yapabilen her türlü organizma ya da maddeye ne ad verilir?", options:["Toksin","Mikrop","Patojen","Biyolojik silah","Virüs"], correctIndex:2},
{id:10, question:"Virüslerin özellikleri ile ilgili aşağıdaki ifadelerden hangisi doğrudur?", options:["Kendi enerji kaynaklarını kullanırlar.","Yaşamak için canlı hücrelere ihtiyaç duyarlar.","Pek çok virüse karşı aşı geliştirilmiştir.","Boyut olarak bakterilerden büyüktürler.","Antibiyotiklerle tedavi edilirler."], correctIndex:1},
{id:11, question:"Yüksüz atom veya molekülün yüklü hâle gelmesi işlemine ne ad verilir?", options:["Çözünme","İyonlaşma","Radyasyon","Soğurma","Bozunum"], correctIndex:1},
{id:12, question:"Daha büyük bir kararsız atom çekirdeği tarafından yayınlanan, pozitif yüklü helyum çekirdeğine ne ad verilir?", options:["Alfa radyasyonu","Beta radyasyonu","Gama radyasyonu","X ışınları","Nötron radyasyonu"], correctIndex:0},
{id:13, question:"Aşağıdaki elementlerden hangisinin temel yapı taşları atomlardan oluşmaz?", options:["Hidrojen","Demir","Oksijen","Karbon","Tahta"], correctIndex:4},
{id:14, question:"Birçok nüklit kararlı olmasına rağmen, çoğunluğu da kararsızdır. Kararlılık esasen nüklidin -------- ve -------- sayıları arasındaki denge ile belirlenir. Yukarıdaki cümlede boş bırakılan yerleri aşağıdakilerden hangisi sırasıyla ve doğru şekilde tamamlar?", options:["elektron / nötron","nötron / proton","elektron / proton","alfa parçacığı / foton","beta parçacığı / elektron"], correctIndex:1},
{id:15, question:"Doğal radyasyon ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", options:["Doğal iyonlaştırıcı radyasyon günlük yaşantımızda başlıca maruz kalınan ışınlanma türüdür.","Havada, gıda ve içeceklerde doğal radyoaktivite mevcuttur.","Doğal radyasyonun tamamı güneş tarafından oluşturulur.","Dünya doğal yapısı itibariyle radyoaktiftir.","Doğal radyasyon kaynakları, kozmik ışınları, yerküreden gelen gama ışınlarını, havadaki radon bozunum ürünlerini, yiyecek ve içeceklerde doğal olarak bulunan çeşitli radyonüklitleri içerir."], correctIndex:2},
{id:16, question:"Kitap bombanın tanınmasına yönelik aşağıdaki ifadelerden hangisi yanlıştır?", options:["Kitabın iç kısmı oyulurken kitap çevresinde yırtılma emareleri olabilir.","Bombanın imalinde kullanılan pil, kablo dedektör ile yapılan kontrolde tespit edilemez.","Kitap emsallerine göre daha ağırdır.","Patlayıcı maddenin kokusu algılanabilir.","Adres bölümünde zata veya kişiye özel ibareleri olabilir."], correctIndex:1},
{id:17, question:"Hararet ve şok tesiriyle bulundukları hacimden kimyasal değişikliğe uğrayarak büyük hacimde gaz, yüksek derecede ısı meydana getirebilen katı, sıvı ve gaz hâldeki tüm kimyasal bileşim ve karışımlara ------- denir. Yukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", options:["bomba","patlama","patlama yeri","patlayıcı madde","patlatma"], correctIndex:3},
{id:18, question:"Aşağıdakilerden hangisi kitle imha silahı kapsamında yer almaz?", options:["Biyolojik silahlar","Nükleer silahlar","Radyolojik silahlar","Konvansiyonel silahlar","Kimyasal silahlar"], correctIndex:3},
{id:19, question:"Aşağıdakilerden hangisi nükleer madde, malzeme ve teknolojilere ilişkin ihracatın kontrol altına alınması maksadıyla oluşturulmuştur?", options:["Füze Teknolojisi Kontrol Rejimi","Nükleer Tedarikçiler Grubu","Wassenaar Düzenlemesi","Avustralya Rejimi","Zangger Komitesi"], correctIndex:4},
{id:20, question:"Kitli imha silahlarının üretim imkânları ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", options:["Biyolojik silahların üretimi fazla beceri ve uzmanlık gerektirmez.","Kimyasal ve biyolojik silahların üretimi araştırma paravanı ardında saklanabilir.","Pestisit fabrikası kolayca kimyasal silah üretimine elverişli hale getirilebilir.","Biyolojik silah üretimi için olanaklar hemen hemen bütün laboratuvarlarda bulunabilir.","Nükleer hammadde kolayca bir silaha dönüştürülebilir."], correctIndex:4},

{id:21, question:"Gerçekte var olmayan ancak birey tarafından algılandığı düşünülen nesnelerin görülmesine neden olan maddelere ne ad verilir?", options:["Uyuşturucu ajanlar","Patojen","Sinir ajanları","Halüsinojen","Siyanojen"], correctIndex:3},
{id:22, question:"Aşağıdakilerden hangisi kan zehirleyici ajanlara yüksek dozda maruz kalınması durumunda meydana gelen fiziksel etkilerden biri değildir?", options:["Hızlı soluk alıp verme","Gözlerde yaşarma","Vücutta kasılma","Koma","Ölüm"], correctIndex:1},
{id:23, question:"Boğucu gazlardan olup, küflü saman kokusuna benzer bir kokusu olan, buharının yoğunluğu havadan fazla olduğu için zemine çöken ve bu nedenle kalıcılığı fazla olan gaz aşağıdakilerden hangisidir?", options:["Sarin","VX","Fosgen","Tabun","Levizit"], correctIndex:2},
{id:24, question:"Toksik etkileri sonucunda canlıları; öldürme, yaralama veya temel yaşam fonksiyonlarını bozarak etkisiz hale getirme gibi özelliklere sahip kimyasal maddelere genel olarak ------- denilmektedir. Yukarıdaki cümlede boş bırakılan yeri aşağıdakilerden hangisi doğru şekilde tamamlar?", options:["kimyasal silah","kimyasal savaş ajanı","kitle imha silahı","kimyasal savaş silahı","kimyasal molekül"], correctIndex:1},

{id:26, question:"Aşağıdakilerden hangisi biyolojik saldırı sonrasında yapılması gerekenler arasında yer almaz?", options:["Kesikler ve yaralar antiseptikle iyice pansuman edilmeli ve kapatılmalıdır.","Cilt temizliği %0.5'lik sodyum hipoklorit (1/10 seyreltilmiş çamaşır suyu) çözeltisi ile yapılmalıdır.","Kirlenmiş personelin üzerindeki potansiyel olarak kirlenmiş olan giysiler personelin üzerindeyken acilen temizlenmelidir.","Biyolojik saldırıya maruz kaldığı belirlenen kazazedeler öncelikle karantinaya alınmalıdır.","Biyolojik savaş ajanlarının atıldığı yerin yakınından gelen kazazedeler yüksek oranda bulaşıcı olarak kabul edilmelidir."], correctIndex:2},
{id:27, question:"Aşağıdakilerden hangisi biyolojik savaş ajanlarının genel özelliklerinden biridir?", options:["Üretim maliyetlerinin düşük olması","Etkili bir saldırı için çok fazla miktarda biyolojik savaş ajanına ihtiyaç duyulması","Kuvvetli yağışlarda etkilerinin artması","Bulaşıcılık özelliğinin olmaması","Tespit edilmelerinin kolay olması"], correctIndex:0},

{id:80, question:"Hastane gibi müdahale ve iyileştirme kuruluşları tarafından afetlerin etkilerini öngörmek, müdahale etmek ve etkili bir şekilde iyileşmek için geliştirilen bilgi ve kapasite olarak tanımlanan kavram aşağıdakilerden hangisidir?", options:["Hazırlıklı olma","Risk değerlendirme","Planlı olma","Afet yönetimi","Risk yönetimi"], correctIndex:0}
]
    },
  ];

  let activeDeckId = decks[0] ? decks[0].id : null;
  let editorOpen = false;

  // Quiz/test state
  let queue = [];
  let totalCount = 0;
  let correctCount = 0;
  let mistakeCount = 0;
  let answered = false;
  let lastAnswerCorrect = null;
  let queueDeckId = null; // hangi dersin kuyruğu şu an yüklü, deck değişince karşılaştırılır

  const deckListEl = document.getElementById('deckList');
  const mainArea = document.getElementById('mainArea');
  const overlayRoot = document.getElementById('overlayRoot');
  const newDeckBtn = document.getElementById('newDeckBtn');
  const editLink = document.getElementById('editLink');

  function activeDeck(){ return decks.find(d => d.id === activeDeckId); }
  function nextId(deck){ return deck.cards.reduce((m,c)=>Math.max(m,c.id),0) + 1; }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  const LETTERS = ['A','B','C','D','E','F'];

  function renderDeckList(){
    deckListEl.innerHTML = decks.map(d => `
      <button class="deck-btn ${d.id===activeDeckId?'active':''}" data-id="${d.id}">
        <span>${escapeHtml(d.name)}</span>
        <small>${d.cards.length}</small>
      </button>
    `).join('');
    deckListEl.querySelectorAll('.deck-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(btn.dataset.id === activeDeckId) return;
        activeDeckId = btn.dataset.id;
        renderAll();
      });
    });
  }

  newDeckBtn.addEventListener('click', ()=>{
    const name = prompt('Yeni setin adı nedir?');
    if(!name || !name.trim()) return;
    const id = 'set-' + Date.now();
    decks.push({id, name: name.trim(), cards:[]});
    activeDeckId = id;
    renderAll();
  });

  editLink.addEventListener('click', ()=>{
    if(!activeDeck()) return;
    editorOpen = true;
    renderAll();
  });

  function renderAll(){
    renderDeckList();
    renderMain();
    renderOverlay();
  }

  // ---------- Test / quiz ----------
  function buildQueue(deck){
    const order = shuffle(deck.cards);
    return order.map(card=>{
      const correctText = card.options[card.correctIndex];
      const options = shuffle(card.options.slice());
      return {cardId: card.id, front: card.question, answer: correctText, options};
    });
  }

  function startTest(deck){
    queue = buildQueue(deck);
    totalCount = deck.cards.length;
    correctCount = 0;
    mistakeCount = 0;
    answered = false;
    lastAnswerCorrect = null;
    queueDeckId = deck.id;
  }

  function renderMain(){
    const deck = activeDeck();
    if(!deck){
      mainArea.innerHTML = `<p class="empty-state">Henüz bir set yok. Sol taraftan "+ yeni set" ile bir set oluştur.</p>`;
      return;
    }

    mainArea.innerHTML = `
      <div class="deck-heading">
        <div>
          <h2>${escapeHtml(deck.name)}</h2>
          <div class="count">${deck.cards.length} soru</div>
        </div>
      </div>
      <div id="testBody"></div>
    `;
    const body = document.getElementById('testBody');

    if(deck.cards.length < 2){
      body.innerHTML = `<p class="empty-state">Bu sette henüz test başlatmaya yetecek kadar soru yok (en az 2 gerekiyor).</p>`;
      return;
    }

    if(queueDeckId !== deck.id){
      startTest(deck);
    }

    renderTestBody(deck, body);
  }

  function renderTestBody(deck, body){
    const finished = queue.length === 0;

    if(finished){
      body.innerHTML = `
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
          <div class="progress-label"><span>${totalCount} / ${totalCount} doğru</span><span>${mistakeCount} yanlış deneme</span></div>
        </div>
        <div class="quiz-box quiz-result">
          <div class="badge">TUR TAMAMLANDI</div>
          <div class="score">${totalCount} / ${totalCount}</div>
          <div class="sub">${mistakeCount === 0 ? 'Tek denemede tamamladın.' : mistakeCount + ' yanlış denemeden sonra tüm sorular doğru işaretlendi.'}</div>
          <button class="restart-btn" id="restartBtn">Turu tekrar başlat</button>
        </div>
      `;
      document.getElementById('restartBtn').addEventListener('click', ()=>{
        startTest(deck);
        renderMain();
      });
      return;
    }

    const q = queue[0];
    const pct = Math.round((correctCount/totalCount)*100);

    body.innerHTML = `
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div class="progress-label"><span>${correctCount} / ${totalCount} doğru</span><span>kalan: ${queue.length}</span></div>
      </div>
      <div class="quiz-box">
        <div class="quiz-eyebrow">SORU</div>
        <div class="quiz-q">${escapeHtml(q.front)}</div>
        <div class="quiz-options">
          ${q.options.map((opt,i) => `<button class="quiz-option" data-opt="${escapeHtml(opt)}"><span class="opt-letter">${LETTERS[i]})</span><span>${escapeHtml(opt)}</span></button>`).join('')}
        </div>
        <div class="quiz-footer">
          <span>${mistakeCount} yanlış deneme</span>
          <button class="quiz-next" id="nextQ" ${answered?'':'disabled'}>${queue.length>1 || lastAnswerCorrect===false ? 'Sonraki →' : 'Bitir →'}</button>
        </div>
      </div>
    `;

    const optionButtons = body.querySelectorAll('.quiz-option');
    optionButtons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(answered) return;
        answered = true;
        const chosen = btn.dataset.opt;
        const isCorrect = chosen === q.answer;
        lastAnswerCorrect = isCorrect;

        optionButtons.forEach(b=>{
          b.disabled = true;
          if(b.dataset.opt === q.answer) b.classList.add('correct');
          else if(b === btn && !isCorrect) b.classList.add('wrong');
        });

        if(isCorrect){ correctCount++; } else { mistakeCount++; }
        document.getElementById('nextQ').disabled = false;
      });
    });

    document.getElementById('nextQ').addEventListener('click', ()=>{
      const wasCorrect = lastAnswerCorrect;
      queue.shift();
      if(!wasCorrect){ queue.push(q); }
      answered = false;
      lastAnswerCorrect = null;
      renderTestBody(deck, body);
    });
  }

  // ---------- Editor overlay (yalnızca düzenleme/silme — ekleme yok) ----------
  function renderOverlay(){
    if(!editorOpen){ overlayRoot.innerHTML = ''; return; }
    const deck = activeDeck();
    if(!deck){ editorOpen = false; overlayRoot.innerHTML = ''; return; }

    overlayRoot.innerHTML = `
      <div class="overlay" id="overlayBg">
        <div class="editor-panel">
          <div class="editor-panel-header">
            <h3>${escapeHtml(deck.name)} — Soruları düzenle</h3>
            <button class="close-btn" id="closeEditor">✕</button>
          </div>
          <div class="card-list" id="cardList">
            ${deck.cards.map(c => `
              <div class="q-card" data-id="${c.id}">
                <div class="q-card-top">
                  <textarea class="q-text" data-id="${c.id}">${escapeHtml(c.question)}</textarea>
                  <button class="del-q" data-id="${c.id}" title="Soruyu sil">✕</button>
                </div>
                ${c.options.map((opt,i)=>`
                  <div class="opt-row ${i===c.correctIndex?'is-correct':''}">
                    <input type="radio" name="correct-${c.id}" data-id="${c.id}" data-idx="${i}" ${i===c.correctIndex?'checked':''}>
                    <input type="text" class="opt-text" data-id="${c.id}" data-idx="${i}" value="${escapeHtml(opt)}">
                  </div>
                `).join('')}
              </div>
            `).join('') || '<div class="empty-cards">Bu sette henüz soru yok.</div>'}
          </div>
        </div>
      </div>
    `;

    document.getElementById('overlayBg').addEventListener('click', (e)=>{
      if(e.target.id === 'overlayBg'){ editorOpen = false; renderOverlay(); renderMain(); }
    });
    document.getElementById('closeEditor').addEventListener('click', ()=>{
      editorOpen = false; renderOverlay(); renderMain();
    });

    function resetTestProgress(){
      queue = []; correctCount = 0; mistakeCount = 0;
    }

    document.getElementById('cardList').querySelectorAll('.q-text').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const card = deck.cards.find(c=>c.id===Number(inp.dataset.id));
        if(card){ card.question = inp.value.trim(); resetTestProgress(); }
      });
    });
    document.getElementById('cardList').querySelectorAll('.opt-text').forEach(inp=>{
      inp.addEventListener('change', ()=>{
        const card = deck.cards.find(c=>c.id===Number(inp.dataset.id));
        if(card){ card.options[Number(inp.dataset.idx)] = inp.value.trim(); resetTestProgress(); }
      });
    });
    document.getElementById('cardList').querySelectorAll('input[type=radio]').forEach(radio=>{
      radio.addEventListener('change', ()=>{
        const card = deck.cards.find(c=>c.id===Number(radio.dataset.id));
        if(card){ card.correctIndex = Number(radio.dataset.idx); resetTestProgress(); renderOverlay(); }
      });
    });
    document.getElementById('cardList').querySelectorAll('.del-q').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = Number(btn.dataset.id);
        deck.cards = deck.cards.filter(c=>c.id!==id);
        resetTestProgress();
        renderDeckList();
        renderOverlay();
      });
    });
  }

  renderAll();
})();
</script>
</body>
</html>
